<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Termin bestätigt — DUA Beratung</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,800&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">

<!-- GOOGLE-ADS-CONVERSION-TAG-PLACEHOLDER -->

<style>
:root{
  --night:#170F12;--cream:#F6EFE7;--mute:#B3A39C;--signal:#E03131;
  --light:#FBF7F1;--ink:#241A1D;--ink-mute:#6A5A5E;--edge-dark:#DDD0C2;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--night);color:var(--cream);font-family:'Karla',system-ui,sans-serif;font-size:16.5px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;}
h1{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:600;letter-spacing:-0.02em;}
.wrap{max-width:640px;margin:0 auto;padding:0 28px;}
header{padding:20px 0;}
.logo{display:flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque';font-size:20px;font-weight:800;text-decoration:none;color:var(--cream);}
.logo-mark{width:30px;height:30px;}
main{flex:1;display:flex;align-items:center;padding:60px 0;}
.card{text-align:center;width:100%;}
.check{width:72px;height:72px;border-radius:50%;background:var(--signal);display:flex;align-items:center;justify-content:center;margin:0 auto 28px;}
h1{font-size:clamp(28px,4.5vw,42px);margin-bottom:16px;}
p{color:var(--mute);font-size:17px;max-width:44ch;margin:0 auto 32px;}
.btn{
  display:inline-flex;padding:14px 28px;border-radius:999px;font-weight:700;font-size:15.5px;
  background:var(--signal);color:#fff;text-decoration:none;
}
footer{padding:26px 0;text-align:center;font-size:13.5px;color:var(--mute);}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a href="/" class="logo">
      <svg class="logo-mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#E03131"/><path d="M13 27 V13 h6 a7 7 0 0 1 0 14 z" fill="#F6EFE7"/></svg>
      DUA Beratung
    </a>
  </div>
</header>

<main class="wrap">
  <div class="card">
    <div class="check">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>Ihr Termin ist bestätigt.</h1>
    <p>Sie erhalten in Kürze eine Bestätigung per E-Mail mit allen Details. Wir freuen uns auf das Gespräch mit Ihnen.</p>
    <a href="/" class="btn">Zurück zur Startseite</a>
  </div>
</main>

<footer class="wrap">© 2026 DUA Beratung</footer>
</body>
</html>
